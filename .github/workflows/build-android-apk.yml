name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/English-Study-Co-Master.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-Study-Co-Master-APK
          path: android/app/build/outputs/apk/debug/English-Study-Co-Master.apk
          retention-days: 90

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          git tag -f android-latest
          git push origin android-latest --force
          gh release create android-latest app/build/outputs/apk/debug/English-Study-Co-Master.apk --title "English Study Co.Master APK" --notes "Latest Android APK. Download and install English-Study-Co-Master.apk."
